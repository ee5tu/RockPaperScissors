<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="stylesheet.css" rel="stylesheet" />
		<title>Rock Paper Scissors</title>
	</head>
	<body>
		<div class="siteContainer">
			<h1 class="header">Rock Paper Scissors</h1>

			<div class="centerScore">
				<div class="box score">
					<p id="humanScore">0</p>
					<p>-</p>
					<p id="computerScore">0</p>
				</div>
			</div>

			<div class="gameContainer">
				<div class="player box">
					<p class="playerHeader">You</p>
					<p id="humanChoice" class="choice">🙈</p>

					<div class="choices">
						<button id="rockBtn">Rock</button>
						<button id="paperBtn">Paper</button>
						<button id="ScissorsBtn">Scissors</button>
					</div>
				</div>

				<div class="player box">
					<p class="playerHeader">Computer</p>
					<p id="computerChoice" class="choice">🤖</p>

					<p style="padding: 2%" class="robotMsg"></p>
				</div>
			</div>

			<div class="displayMsg box">
				<p>Make you first choice of Rock, Paper or Scissors.</p>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
